<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise - Interactive Budget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>SpendWise 💰</h1>
    <p>Track your money wisely</p>

    <div class="card">
      <label>Monthly Income (Ksh)</label>
      <input type="number" id="incomeInput" placeholder="e.g. 40000"> 
      <button id="setIncomeBtn">Set Income</button>
    </div>

    <div class="dashboard">
      <div><span>Income:</span> <b id="incomeDisplay">0</b></div>
      <div><span>Total Expenses:</span> <b id="totalDisplay">0</b></div>
      <div><span>Balance:</span> <b id="balanceDisplay">0</b></div>
      <p id="message">Enter your income to start.</p>
    </div>

    <div class="card">
      <h2>Add Expense</h2>
      <input type="text" id="expenseName" placeholder="Expense name e.g. Lunch">
      <input type="number" id="expenseAmount" placeholder="Amount e.g. 500">
      <select id="expenseCategory">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Rent">Rent</option>
        <option value="Other">Other</option>
      </select>
      <button id="addExpenseBtn">Add Expense</button>
    </div>

    <div class="card">
      <h2>Expense List</h2>
      <ul id="expenseList"></ul>
      <button id="clearBtn">Clear All</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
